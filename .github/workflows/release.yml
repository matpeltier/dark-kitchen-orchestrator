name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Build publishable CLI bundle
        run: pnpm --filter dark-kitchen build

      - name: Validate documentation
        run: node packaging/check-docs.mjs

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vMAJOR.MINOR.PATCH release tags are supported" >&2
            exit 1
          fi
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Pack npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack"
          npm pack ./apps/cli --pack-destination "$RUNNER_TEMP/npm-pack"

      - name: Smoke clean npm installation
        run: |
          package_tarball="$(find "$RUNNER_TEMP/npm-pack" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_tarball"
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init --yes
          npm install "$package_tarball"
          npm audit --omit=dev --audit-level=high
          test -s node_modules/dark-kitchen/README.md
          test -s node_modules/dark-kitchen/LICENSE
          test -s node_modules/dark-kitchen/NOTICE
          test ! -d node_modules/discord.js
          test ! -d node_modules/@slack/bolt
          test ! -d node_modules/whatsapp-web.js
          git init
          git config user.email smoke@example.invalid
          git config user.name 'Dark Kitchen smoke'
          printf 'preserve me\n' > unrelated.txt
          npx --no-install dark-kitchen --help
          test "$(npx --no-install dark-kitchen --version)" = "$(node -p "require('$RUNNER_TEMP/npm-smoke/node_modules/dark-kitchen/package.json').version")"
          npx --no-install dark-kitchen init
          test -f .dark-kitchen/config.yaml
          grep -q 'id: fixer' .dark-kitchen/config.yaml
          grep -q 'id: repository-tester' .dark-kitchen/config.yaml
          test "$(cat unrelated.txt)" = 'preserve me'
          first_hash="$(sha256sum .dark-kitchen/config.yaml | cut -d' ' -f1)"
          npx --no-install dark-kitchen init
          second_hash="$(sha256sum .dark-kitchen/config.yaml | cut -d' ' -f1)"
          test "$first_hash" = "$second_hash"
          npx --no-install dark-kitchen doctor

      - name: Upload tested npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-kitchen-npm
          path: ${{ runner.temp }}/npm-pack/*.tgz
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag dark-kitchen:smoke .

      - name: Start daemon with persistent volumes
        run: |
          project_dir="$RUNNER_TEMP/container-project"
          runtime_dir="$RUNNER_TEMP/container-runtime"
          tool_dir="$RUNNER_TEMP/container-tools"
          mkdir -p "$project_dir" "$runtime_dir" "$tool_dir"
          chmod 0777 "$project_dir" "$runtime_dir" "$tool_dir"
          git -C "$project_dir" init
          docker run --detach --name dark-kitchen-smoke \
            --env DK_NO_DASHBOARD=1 \
            --volume "$project_dir:/workspace" \
            --volume "$runtime_dir:/workspace/.dark-kitchen/runtime" \
            --volume "$tool_dir:/home/node/.dark-kitchen" \
            dark-kitchen:smoke start --foreground
          for attempt in $(seq 1 20); do
            if docker logs dark-kitchen-smoke 2>&1 | grep -q 'Daemon started'; then
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' dark-kitchen-smoke)" != true; then
              docker logs dark-kitchen-smoke
              exit 1
            fi
            sleep 1
          done
          docker logs dark-kitchen-smoke 2>&1 | grep -q 'Daemon started'
          test -f "$runtime_dir/store.db"
          docker stop --time 30 dark-kitchen-smoke

      - name: Print container logs on failure
        if: failure()
        run: docker logs dark-kitchen-smoke 2>&1 || true

      - name: Remove smoke container
        if: always()
        run: docker rm --force dark-kitchen-smoke 2>/dev/null || true

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-and-pack, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org

      - name: Download tested npm artifact
        uses: actions/download-artifact@v4
        with:
          name: dark-kitchen-npm
          path: npm-pack

      - name: Publish exact tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_tarball="$(find npm-pack -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_tarball"
          package_manifest="$(tar -xOf "$package_tarball" package/package.json)"
          package_name="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.name)' "$package_manifest")"
          package_version="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.version)' "$package_manifest")"
          local_integrity="$(node -e 'const {createHash}=require("node:crypto"); const {readFileSync}=require("node:fs"); process.stdout.write("sha512-"+createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"))' "$package_tarball")"
          if published_integrity="$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null)"; then
            test "$published_integrity" = "$local_integrity"
            echo "$package_name@$package_version already exists with the exact tested integrity; skipping duplicate publish"
          else
            npm publish "./$package_tarball" --access public --provenance
          fi

  publish-container:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-and-pack, container-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable + latest image tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm, publish-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested npm artifact
        uses: actions/download-artifact@v4
        with:
          name: dark-kitchen-npm
          path: npm-pack

      - name: Create release with generated notes and tested tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" npm-pack/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" npm-pack/*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
